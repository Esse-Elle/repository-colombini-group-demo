<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: home di gruppo (banda blu notte con arco + griglia dei brand), pagina brand (barra rossa identitaria, schede sezione, griglia anteprime), visualizzatore a tutto schermo */
:root{
  color-scheme: light;
  /* Gruppo */
  --cg-navy:#161D33; --cg-greige:#CBC6BB; --cg-taupe:#75655C; --cg-paper:#F4F2EE; --cg-white:#FFFFFF; --cg-ink:#1E2230;
  /* Febal Casa */
  --fc-red:#E30513; --fc-moro:#564337; --fc-grey:#857F7D; --fc-light:#DADADA; --fc-black:#000000; --fc-white:#FFFFFF; --fc-paper:#ECEBEA;
  --f-cg-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-cg-text:"Karla","Helvetica Neue",Arial,sans-serif;
  --f-fc-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-fc-text:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
body{background:var(--cg-paper);color:var(--cg-ink);font-family:var(--f-cg-text);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--fc-red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}

/* ---------- demo bar ---------- */
.demobar{background:var(--cg-ink);color:#E9E6E0;font-size:13px}
.demobar .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:9px}
.demobar strong{color:#fff;font-weight:700}
.demobar .who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid rgba(255,255,255,.28);background:transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;color:#E9E6E0}
.chip[aria-pressed="true"]{background:#fff;color:var(--cg-ink);border-color:#fff}

/* ---------- home gruppo ---------- */
.hero{background:var(--cg-navy);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-block:56px 64px;display:grid;gap:22px}
.hero img.cglogo{height:26px;width:auto}
.hero h1{font-family:var(--f-cg-display);font-size:clamp(38px,6vw,68px);line-height:1.02;max-width:12ch}
.hero p{max-width:52ch;color:#D9D6CF;margin:0;font-size:16px}
.hero .arc{position:absolute;right:-6%;bottom:-8%;width:min(62%,760px);opacity:.95;pointer-events:none}
@media (max-width:700px){.hero .arc{width:110%;right:-40%;opacity:.35}}
.home-body{padding-block:44px 64px;display:grid;gap:28px}
.sect-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;border-bottom:1px solid var(--cg-greige);padding-bottom:12px}
.sect-head h2{font-family:var(--f-cg-display);font-size:30px}
.sect-head p{margin:0;color:var(--cg-taupe);max-width:56ch}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.bcard{display:grid;grid-template-rows:150px auto;background:var(--cg-white);border:1px solid #E2DED6;text-align:left;padding:0;transition:transform .2s ease, box-shadow .2s ease}
.bcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(22,29,51,.45)}
.bcard .face{display:grid;place-items:center;position:relative}
.bcard .face img{max-width:62%;max-height:46px;width:auto}
.bcard .meta{padding:16px 18px 18px;display:grid;gap:6px}
.bcard .meta b{font-family:var(--f-cg-display);font-weight:400;font-size:22px}
.bcard .meta span{color:var(--cg-taupe);font-size:13.5px}
.status{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--cg-ink)}
.status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3A9A5B;margin-right:6px;vertical-align:1px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.linkbox{background:var(--cg-white);border:1px solid #E2DED6;padding:16px 18px;display:grid;gap:8px;min-width:0}
.linkbox b{font-family:var(--f-cg-display);font-weight:400;font-size:19px}
.linkbox .sees{color:var(--cg-taupe);font-size:13.5px}
.url{display:flex;gap:8px;align-items:center;min-width:0}
.url code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;background:var(--cg-paper);padding:6px 8px;border:1px solid #E2DED6;user-select:all}
.btn-sm{border:1px solid var(--cg-ink);background:transparent;padding:6px 10px;font-size:12.5px;white-space:nowrap}
.btn-sm.solid{background:var(--cg-ink);color:#fff}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.how div{border-top:2px solid var(--cg-navy);padding-top:12px}
.how b{display:block;font-family:var(--f-cg-display);font-weight:400;font-size:19px;margin-bottom:4px}
.how p{margin:0;color:#4C4A52;font-size:14px}
.archi{display:block;width:100%;max-width:100%;height:auto;opacity:.9}

/* ---------- pagina brand Febal Casa ---------- */
.fc{background:var(--fc-paper);color:var(--fc-black);font-family:var(--f-fc-text);min-height:100vh;position:relative}
.fc::before{content:"";position:fixed;left:0;top:0;bottom:0;width:10px;background:var(--fc-red);z-index:5}
.fc .wrap{padding-left:max(28px, calc(env(safe-area-inset-left, 0px) + 18px))}
.fc-top{background:var(--fc-light)}
.fc-top .wrap{padding-block:14px 30px;display:grid;gap:26px}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.fc-bar .crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fc-bar .crumb button{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;letter-spacing:inherit;text-transform:inherit;font-size:inherit}
.fc-hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.fc-hero h1{font-family:var(--f-fc-display);font-size:clamp(36px,5.4vw,60px);line-height:1.05}
.fc-hero p{margin:10px 0 0;max-width:58ch;color:#3B3431}
.fc-hero img{width:76px;height:76px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #C9C7C6}
.tab{background:none;border:0;padding:12px 14px 13px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;color:#3B3431}
.tab[aria-selected="true"]{border-bottom-color:var(--fc-red);color:var(--fc-black);font-weight:500}
.tab .n{color:var(--fc-grey);font-variant-numeric:tabular-nums;margin-left:4px}
.fc-main .wrap{padding-block:26px 70px;display:grid;gap:18px}
.sec-intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:end}
.sec-intro h2{font-family:var(--f-fc-display);font-size:32px}
.sec-intro p{margin:4px 0 0;color:#4A4240;max-width:60ch;font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtn{border:1px solid var(--fc-black);background:transparent;padding:9px 14px;font-size:13.5px;display:inline-flex;gap:8px;align-items:center}
.tbtn.primary{background:var(--fc-red);border-color:var(--fc-red);color:#fff}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.selinfo{font-size:13px;color:var(--fc-grey);font-variant-numeric:tabular-nums;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.item{background:var(--fc-white);display:grid;grid-template-rows:auto 1fr;position:relative;min-width:0;outline:2px solid transparent;transition:outline-color .15s}
.item.sel{outline-color:var(--fc-red)}
.thumb{position:relative;display:block;width:100%;padding:0;border:0;background:#F3F2F1;aspect-ratio:3/2;overflow:hidden}
.grid.tall .thumb{aspect-ratio:4/5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.thumb.contain img{object-fit:contain;padding:18%}
.item:hover .thumb img{transform:scale(1.03)}
.thumb .kind{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px}
.pick{position:absolute;top:10px;left:10px;z-index:2;display:grid;place-items:center;width:28px;height:28px;background:rgba(255,255,255,.95);border:1px solid #BDBAB8;cursor:pointer}
.pick input{appearance:none;width:16px;height:16px;border:1.5px solid var(--fc-black);margin:0;display:grid;place-items:center;cursor:pointer}
.pick input:checked{background:var(--fc-red);border-color:var(--fc-red)}
.pick input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.info{padding:12px 14px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.info b{font-weight:500;font-size:14px;line-height:1.35}
.info .fn{font-size:11.5px;color:var(--fc-grey);overflow-wrap:anywhere}
.info .spec{font-size:12px;color:#4A4240;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:6px;margin-top:8px}
.row-actions button{flex:1;border:1px solid #C9C7C6;background:transparent;padding:7px 8px;font-size:12.5px}
.row-actions button:hover{border-color:var(--fc-black)}
.solo-note{background:var(--fc-moro);color:#fff;font-size:13px}
.solo-note .wrap{padding-block:9px}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.fold{background:var(--fc-white);display:grid;min-width:0}
.fcover{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:0;border:0;background:var(--fc-white);aspect-ratio:16/10;overflow:hidden}
.fcover img{width:100%;height:100%;object-fit:cover;display:block}
.fcover img:first-child{grid-row:1/3}
.fcover img:only-child{grid-column:1/3}
.finfo{padding:12px 14px 14px;display:grid;gap:8px}
.finfo b{font-family:var(--f-fc-display);font-weight:400;font-size:22px;letter-spacing:.02em;display:block}
.finfo span{font-size:12.5px;color:var(--fc-grey)}
.fcrumb{display:flex;gap:8px;align-items:center;font-size:13px}
.fcrumb button{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.fcrumb b{font-weight:500}
.search{display:grid;gap:8px;max-width:720px}
.search input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid #9E9997;background:var(--fc-white);color:var(--fc-black);width:100%}
.search input:focus{outline:2px solid var(--fc-red);outline-offset:0;border-color:var(--fc-red)}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:#4A4240}
.examples button{border:1px solid #B9B5B3;background:transparent;padding:4px 10px;border-radius:999px;font-size:12.5px}
.examples button:hover{border-color:var(--fc-black)}
.fpath{background:none;border:0;padding:0;text-align:left;font-size:11.5px;color:var(--fc-red);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.seltools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subhead{font-family:var(--f-fc-display);font-size:22px;margin-top:10px}
.sharemeta{display:inline-block;background:var(--fc-moro);color:#fff!important;padding:5px 10px;font-size:13px}
body.viewonly .dlonly,body.viewonly .pick{display:none!important}
/* ---------- pagina brand in preparazione ---------- */
.soon{min-height:70vh;display:grid;place-items:center;text-align:center;padding:60px 16px}
.soon img{height:44px;width:auto;margin:0 auto 22px}
.soon h1{font-family:var(--f-cg-display);font-size:38px;margin-bottom:10px}
.soon p{color:var(--cg-taupe);max-width:50ch;margin:0 auto 22px}

/* ---------- visualizzatore ---------- */
dialog{border:0;padding:0;max-width:none;max-height:none}
dialog::backdrop{background:rgba(10,10,12,.86)}
#viewer{width:min(1180px,96vw);height:min(860px,92vh);background:#111;color:#fff;font-family:var(--f-fc-text)}
#viewer .vgrid{display:grid;grid-template-columns:1fr 320px;height:100%}
#viewer .stage{position:relative;display:grid;place-items:center;min-height:0;min-width:0;padding:18px;background:#1A1A1A}
#viewer .stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 18px 40px rgba(0,0,0,.4)}
#viewer .stage.logo img{padding:40px}
.pager{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.pager button,.vnav{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:30px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);height:46px}
.vnav.prev{left:10px}.vnav.next{right:10px}
#viewer aside{padding:22px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto;background:#141414;border-left:1px solid #2A2A2A}
#viewer aside h3{font-family:var(--f-fc-display);font-size:24px;line-height:1.15}
#viewer dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
#viewer dt{color:#9C9694}#viewer dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#viewer .close{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.6);border:0;color:#fff;width:36px;height:36px;font-size:20px;line-height:1}
.vbtn{border:1px solid #fff;background:transparent;color:#fff;padding:11px 12px;font-size:13.5px;text-align:left}
.vbtn.primary{background:var(--fc-red);border-color:var(--fc-red)}
.vbtn small{display:block;color:inherit;opacity:.75;font-size:11.5px;margin-top:2px}
@media (max-width:820px){#viewer{width:100vw;height:100%;max-height:100dvh}#viewer .vgrid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}#viewer aside{max-height:46vh;border-left:0;border-top:1px solid #2A2A2A}}

/* ---------- finestra download ---------- */
#dlg{width:min(480px,94vw);background:#fff;color:#000;font-family:var(--f-fc-text)}
#dlg form{padding:24px;display:grid;gap:14px}
#dlg h3{font-family:var(--f-fc-display);font-size:26px}
#dlg p{margin:0;color:#4A4240;font-size:14px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;border:1px solid #D6D4D3;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--fc-red);background:#FDF2F2}
.opt input{margin-top:4px;accent-color:var(--fc-red)}
.opt b{font-weight:500}.opt span{grid-column:2;font-size:12.5px;color:#4A4240}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.progress{height:4px;background:#EEE;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--fc-red);transition:width .2s}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<dialog id="viewer" aria-label="Anteprima file"></dialog>
<dialog id="dlg" aria-label="Opzioni di download"></dialog>
<div id="toast" role="status" hidden></div>

/* ---------- routing con token semplici ---------- */
function route(){
  const h = (location.hash||"").replace("#","");
  document.body.classList.remove("viewonly"); state.share=null;
  const sh = parseToken(h); if (sh){ renderShared(sh); return; }
  const prof = PROFILES.find(p=>p.token===h);
  if (prof){ state.profile=prof; if (prof.solo){ openBrand(prof.solo, true); return; } renderHome(); return; }
  const b = BRANDS.find(b=>b.token===h);
  if (b){ if (!state.profile.brands.includes(b.key)) state.profile = PROFILES[0]; openBrand(b.key, !!state.profile.solo); return; }
  if (state.profile.solo){ openBrand(state.profile.solo, true); return; }
  renderHome();
}
function go(token){ if (location.hash === "#"+token) route(); else location.hash = token; }
window.addEventListener("hashchange", route);

  </div></div>`;
}
function bindDemo(root){ root.querySelectorAll("[data-prof]").forEach(b=>b.onclick=()=>{ state.profile=PROFILES.find(p=>p.token===b.dataset.prof); go(state.profile.token); }); }

async function copyText(t, btn){
  try{ await navigator.clipboard.writeText(t); toast("Link copiato"); }
  catch(e){ const code=btn.parentElement.querySelector("code"); const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Link selezionato: copialo con Cmd+C"); }

const segKey = t => t.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");

/* ---------- condivisione: il token contiene ambito, scadenza e permesso ---------- */
// cond_<ambito>_<scadenza AAAAMMGG | sempre>_<d = vede e scarica | v = solo vede>
// ambito: sez-<sezione> | sez-<sezione>-<cartella~sottocartella> | file-<id>.<id>...
function makeToken(scope, days, perm){
  let exp="sempre";
  if (days!=="0"){ const d=new Date(); d.setDate(d.getDate()+Number(days)); exp=d.toISOString().slice(0,10).replace(/-/g,""); }
  return `cond_${scope}_${exp}_${perm}`;
}
function parseToken(h){
  const m=/^cond_([a-z0-9.~-]+)_(sempre|\d{8})_([dv])$/.exec(h); if(!m) return null;
  const sc=m[1].split("-"); let share={exp:m[2], perm:m[3], token:h, path:[]};
  if (sc[0]==="sez"){
    share.section=sc[1]; const s=secOf(share.section); if(!s) return null;
    const keys=sc.slice(2).join("-"); if (keys){
      for (const k of keys.split("~")){ const seg=[...new Set(itemsUnder(s,share.path).filter(i=>i.path.length>share.path.length).map(i=>i.path[share.path.length]))].find(x=>segKey(x)===k); if(!seg) return null; share.path.push(seg); }
    }
  } else if (sc[0]==="file"){ share.ids=sc.slice(1).join("-").split("."); if(!share.ids.every(find)) return null; }
  else return null;
  return share;
}
function expDate(exp){ return exp==="sempre"?null:new Date(+exp.slice(0,4), +exp.slice(4,6)-1, +exp.slice(6,8), 23,59,59); }
function fmtDate(d){ return d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}); }
function shareLabel(sh){
  if (sh.ids) return sh.ids.length===1 ? find(sh.ids[0]).title : `${sh.ids.length} file selezionati`;
  const s=secOf(sh.section); return [s.label,...sh.path].join(" / ") + (isTree(s)&&!sh.path.length?" (tutte le cartelle)":"");
}
function sharedItems(){
  const sh=state.share; if(!sh) return allItems();
  if (sh.ids) return sh.ids.map(find);
  const s=secOf(sh.section); return isTree(s) ? itemsUnder(s,sh.path) : s.items;
}

/* ---------- ricerca: legge nomi di cartelle e file, riconosce le pagine ---------- */
const STOP=new Set("pagina pagine pag pg p foto del della dello dei delle di da la il lo le i gli un una e in nel nella per mi serve cerco trova trovami".split(" "));
function words(str){ return str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2").split(/[^a-z0-9]+/).filter(Boolean); }
function pagesOf(name){
  const out=[]; const re=/(?:^|[_\s-])(?:p|pag|pagina|pg)\.?\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?[a-z]?(?=$|[_\s.-])/gi; let m;
  const base=name.replace(/\.[a-z0-9]+$/i,"");
  while((m=re.exec(base))){ const a=+m[1], b=m[2]?+m[2]:a; for(let n=a;n<=b && n-a<10;n++) out.push(n); }
  return out;
}
function indexOf(it){
  if (it._ix) return it._ix;
  const sec=secOf(it._sec);
  const fileW=words(it.name.replace(/\.[a-z0-9]+$/i,""));
  const all=words(["febal casa", sec.label, ...(it.path||[]), it.name.replace(/\.[a-z0-9]+$/i,""), it.path?"":it.title].join(" "));
  return it._ix={all, fileW, nums:new Set(all.filter(w=>/^\d+$/.test(w)).map(w=>String(+w))), pages:pagesOf(it.name)};
}
function search(q){
  const toks=words(q).filter(t=>!STOP.has(t)); if(!toks.length) return null;
  const res=[];
  for (const it of sharedItems()){
    const ix=indexOf(it); let score=0, ok=true;
    for (const t of toks){
      if (/^\d+$/.test(t)){ const n=+t; if (ix.pages.includes(n)) score+=10; else if (ix.nums.has(String(n))) score+=1; else { ok=false; break; } }
      else { const st=t.length>5?t.slice(0,-1):t; if (ix.fileW.some(w=>w.startsWith(st))) score+=3; else if (ix.all.some(w=>w.startsWith(st))) score+=1; else { ok=false; break; } }
    }
    if (ok) res.push([score,it]);
  }
  return res.sort((a,b)=>b[0]-a[0] || a[1].name.localeCompare(b[1].name,"it",{numeric:true})).map(x=>x[1]);
}

function drawViewer(){
  const list=state.viewer.list; const it=list[state.viewer.idx]; const v=$("#viewer");
  const pg=state.viewer.page; const sec=secOf(it._sec);
  let src = it.kind==="photo" ? it.file : it.kind==="pdf" ? it.pages[pg] : it.kind==="logo" ? it.file : it.thumb;
  const dlButtons = it.kind==="photo" && it.hr ? `
      <button class="vbtn primary" data-q="alta">Scarica originale<small>${it.w} × ${it.h} px · 300 dpi · ${fmtSize(it.size)}</small></button>
      <button class="vbtn" data-q="bassa">Scarica LD web retina<small>2880 × 1920 px · 150 dpi · sRGB · creata ora</small></button>`
    : `<button class="vbtn primary" data-q="file">Scarica ${kindLabel(it)}<small>${fmtSize(it.size)}</small></button>`;
  v.innerHTML = `<button class="close" aria-label="Chiudi">×</button><div class="vgrid">
    <div class="stage ${it.kind==='logo'?'logo':''}" style="${it.bg?`background:${it.bg}`:''}">
      <img src="${src}" alt="${esc(it.title)}">
      ${list.length>1?`<button class="vnav prev" aria-label="File precedente">‹</button><button class="vnav next" aria-label="File successivo">›</button>`:""}
      ${it.kind==="pdf"?`<div class="pager"><button data-pg="-1" aria-label="Pagina precedente">‹</button><span>Pagina ${pg+1} di ${it.pages.length}</span><button data-pg="1" aria-label="Pagina successiva">›</button></div>`:""}
    </div>
    <aside><span class="eyebrow" style="color:#9C9694">${esc(sec.label)}${it.path?" / "+esc(it.path.join(" / ")):""} · ${state.viewer.idx+1} di ${list.length}</span>
      <h3>${esc(it.title)}</h3>
      <dl><dt>File</dt><dd>${esc(it.name)}</dd><dt>Formato</dt><dd>${kindLabel(it)}</dd>
        ${it.kind==="photo"?`<dt>Misure</dt><dd>${it.w} × ${it.h} px</dd><dt>Risoluzione</dt><dd>${it.dpi} dpi</dd>`:""}
        ${it.kind==="pdf"?`<dt>Pagine</dt><dd>${it.pages.length}</dd>`:""}
        <dt>Peso</dt><dd>${fmtSize(it.size)}</dd></dl>
      <div class="dlonly" style="display:grid;gap:10px">${dlButtons}</div>
      ${state.share?"":`<button class="vbtn" data-vsh="1">Condividi questo file<small>Link con scadenza e permessi</small></button>`}
    </aside></div>`;
  v.querySelector(".close").onclick=()=>v.close();
  const nav=d=>{ state.viewer.idx=(state.viewer.idx+d+list.length)%list.length; state.viewer.page=0; drawViewer(); };
  const p=v.querySelector(".vnav.prev"), n=v.querySelector(".vnav.next"); if(p){p.onclick=()=>nav(-1); n.onclick=()=>nav(1);}
  v.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{ state.viewer.page=(pg+ +b.dataset.pg+it.pages.length)%it.pages.length; drawViewer(); });
  v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>doDownload([it], b.dataset.q==="bassa"?"bassa":"alta", "single"));
  const vs=v.querySelector("[data-vsh]"); if (vs) vs.onclick=()=>{ v.close(); openShare("file-"+it.id, it.title); };
  v.onkeydown=e=>{ if(e.key==="ArrowRight") nav(1); if(e.key==="ArrowLeft") nav(-1); };
}

/* ---------- download ---------- */
let dlNS; const dlReady = (async()=>{ try{ dlNS = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){ dlNS=null; }
  if (!dlNS) dlNS = { save: async ({filename, data}) => { const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return {status:"saved"}; } };
})();

function startDownload(items, mode, zipName, keepFolders){
  if (!items.length) return;
  const hasHR = items.some(i=>i.kind==="photo" && i.hr);
  if (!hasHR) return doDownload(items, "alta", mode, null, zipName, keepFolders);
  const d=$("#dlg"); const multi = mode!=="single";
  d.innerHTML = `<form method="dialog"><h3>${multi?`Scarica ${items.length} foto`:'Scarica la foto'}</h3>
    <p>Le foto catalogo sono archiviate solo in alta risoluzione. Scegli la versione che ti serve.</p>
    <label class="opt"><input type="radio" name="q" value="alta" checked><b>HD, originale</b><span>4500 × 3000 px · 300 dpi · profilo colore nativo · per stampa e cataloghi</span></label>
    <label class="opt"><input type="radio" name="q" value="bassa"><b>LD web retina</b><span>2880 × 1920 px · 150 dpi · sRGB · creata al momento del download</span></label>
    ${multi?`<label class="opt"><input type="radio" name="q" value="entrambe"><b>Entrambe</b><span>Due cartelle nello stesso ZIP: HD e Web-retina</span></label>`:""}
    <div class="progress" hidden><i></i></div>
    <div class="dlg-actions"><button class="btn-sm" value="cancel" type="button" id="dlgCancel">Annulla</button><button class="btn-sm solid" type="submit" id="dlgGo">Scarica</button></div></form>`;
  d.showModal();
  $("#dlgCancel").onclick=()=>d.close();
  d.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const q=new FormData(e.target).get("q"); await doDownload(items, q, mode, d, zipName, keepFolders); };
}

async function fetchBlob(url){ const r=await fetch(url); if(!r.ok) throw new Error("fetch"); return r.blob(); }
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function setJfif150(buf){
  let u=new Uint8Array(buf);
  if (u[2]===0xFF && u[3]===0xE0 && u[6]===0x4A && u[7]===0x46 && u[8]===0x49 && u[9]===0x46){ u[13]=1; u[14]=0; u[15]=150; u[16]=0; u[17]=150; return u; }
  const app0=new Uint8Array([0xFF,0xE0,0,16,0x4A,0x46,0x49,0x46,0,1,1,1,0,150,0,150,0,0]);
  const out=new Uint8Array(u.length+app0.length); out.set(u.slice(0,2),0); out.set(app0,2); out.set(u.slice(2),2+app0.length); return out;
}

function addSrgb(u){
  const icc=Uint8Array.from(atob(SRGB_ICC), c=>c.charCodeAt(0));
  const head=[0x49,0x43,0x43,0x5F,0x50,0x52,0x4F,0x46,0x49,0x4C,0x45,0x00,1,1]; // "ICC_PROFILE\0", segmento 1 di 1
  const len=2+head.length+icc.length;
  const seg=new Uint8Array(2+len); seg.set([0xFF,0xE2,len>>8,len&255],0); seg.set(head,4); seg.set(icc,4+head.length);
  const app0len=(u[4]<<8)|u[5]; const at=4+app0len; // subito dopo APP0 (JFIF)
  const out=new Uint8Array(u.length+seg.length); out.set(u.slice(0,at),0); out.set(seg,at); out.set(u.slice(at),at+seg.length); return out;
}
async function makeSocial(it){
  const im=await loadImg(it.file); const k=Math.min(1, 2880/Math.max(im.naturalWidth, im.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
  const g=c.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(im,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
  return new Blob([addSrgb(setJfif150(await blob.arrayBuffer()))],{type:"image/jpeg"});
}
const socialName = n => n.replace(/\.jpg$/i, "_web-retina_2880px.jpg");

async function doDownload(items, q, mode, dialog, zipName, keepFolders){
  await dlReady;
  if (!dlNS){ if(dialog) dialog.close(); toast("Download non disponibile in questa vista: apri la pagina in claude.ai"); return; }
  const bar = dialog && dialog.querySelector(".progress"); if (bar) bar.hidden=false;
  const tick = f => { if (bar) bar.firstElementChild.style.width=Math.round(f*100)+"%"; };
  const go=$("#dlgGo"); if (go) { go.disabled=true; go.textContent="Preparo…"; }
  try{
    let filename, data;
    if (mode==="single"){
      const it=items[0];
      if (it.kind==="photo" && it.hr && q==="bassa"){ data=await makeSocial(it); filename=socialName(it.name); }
      else { data=await fetchBlob(it.file); filename=it.name; }
    } else {
      if (typeof JSZip==="undefined") throw new Error("zip");
      const zip=new JSZip(); let i=0;
      for (const it of items){
        const isHR = it.kind==="photo" && it.hr; const rel = Array.isArray(keepFolders) && it.path ? it.path.slice(keepFolders.length) : []; const pre = rel.length ? rel.join("/")+"/" : "";
        if (!isHR || q==="alta") zip.file(pre+it.name, await fetchBlob(it.file));
        else if (q==="bassa") zip.file(pre+socialName(it.name), await makeSocial(it));
        else { zip.file("HD/"+pre+it.name, await fetchBlob(it.file)); zip.file("Web-retina/"+pre+socialName(it.name), await makeSocial(it)); }
        tick(++i/items.length*0.8);
      }
      data=await zip.generateAsync({type:"blob"}, m=>tick(0.8+m.percent/500));
      const suff = q==="bassa"?"_web-retina":q==="entrambe"?"_HD-e-web-retina":"";
      filename = (zipName||"FEBALCASA_Download") + (mode==="zip-sel"?`_selezione-${items.length}-file`:"") + suff + ".zip";
    }
    if (dialog) dialog.close();
    await dlNS.save({filename, data});
    toast("Download avviato: "+filename);
  }catch(e){
    if (dialog && dialog.open) dialog.close();
    const c=e&&e.code;
    if (c==="declined") toast("Download annullato");
    else if (c==="rate_limited") toast("C'è già una richiesta di download aperta");
    else toast("Download non riuscito, riprova tra poco");
  }
}
